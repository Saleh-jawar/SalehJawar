<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        video { width: 100%; height: 100vh; object-fit: contain; }
        .error { color: white; text-align: center; padding: 50px; font-family: sans-serif; }
    </style>
</head>
<body>
    <video id="player" controls autoplay playsinline></video>
    <script>
        const params = new URLSearchParams(window.location.search);
        let videoUrl = params.get('url');
        
        if (!videoUrl) {
            videoUrl = "http://082dd340.amazzin.pw/iptv/GGP3ZAYPXGWHWL/7270/index.m3u8";
        }
        
        const video = document.getElementById('player');
        
        // ========== روش جدید: استفاده از fetch با Referer ==========
        // متاسفانه تگ video نمی‌تواند هدر Referer را مستقیماً اضافه کند
        // بنابراین باید از تکنیک fetch + blob استفاده کنیم
        
        fetch(videoUrl, {
            headers: {
                'Referer': 'http://082dd340.amazzin.pw/',
                'Origin': 'http://082dd340.amazzin.pw',
                'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
            }
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            return response.blob();
        })
        .then(blob => {
            const blobUrl = URL.createObjectURL(blob);
            video.src = blobUrl;
            video.play();
        })
        .catch(error => {
            console.error('Error:', error);
            document.body.innerHTML = '<div class="error">❌ خطا در پخش<br>Error loading video<br><br>ممکن است لینک منقضی شده باشد</div>';
        });
    </script>
</body>
</html>
