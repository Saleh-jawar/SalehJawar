<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        video { width: 100%; height: 100vh; object-fit: contain; }
        .error { color: white; text-align: center; padding: 50px; font-family: sans-serif; }
    </style>
</head>
<body>
    <video id="player" controls autoplay playsinline></video>
    <script>
        const params = new URLSearchParams(window.location.search);
        let videoUrl = params.get('url');
        
        if (!videoUrl) {
            videoUrl = "http://082dd340.amazzin.pw/iptv/GGP3ZAYPXGWHWL/7270/index.m3u8";
        }
        
        // ========== استفاده از پروکسی جهانی ==========
        // پروکسی عمومی CORS Anywhere (برای تست)
        const proxyUrl = "https://cors-anywhere.herokuapp.com/";
        const finalUrl = proxyUrl + videoUrl;
        
        const video = document.getElementById('player');
        video.src = finalUrl;
        
        video.onerror = function() {
            document.body.innerHTML = '<div class="error">❌ خطا در پخش<br>Error loading video</div>';
        };
    </script>
</body>
</html>
